seed: 42

# I/O: Box(6) [u_norm, v_norm, valid, d_range_norm, prev_dsway, prev_dsurge]
#       d_range_norm = clip((range_beam - hold_meas) / range_accept_m, ±1)  # sensor only
#       → MLP 128-128 → Gaussian(2) residual on base sway/surge setpoints
# Base (fixed): A beam hold + B station noise + C lateral blend α (cfg)
# PPO learns Δsway/Δsurge; scales from env cfg (α=0.3: ±0.70 / ±0.70 m)
# Reward: image u + train GT |sway_err| (no anti-sway action tax)
# Action: Box(-1,1)^2 → residual on base sway/surge setpoints
models:
  separate: False
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.5
    network:
      - name: net
        input: STATES
        layers: [128, 128]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [128, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

agent:
  class: PPO
  rollouts: 64
  learning_epochs: 8
  mini_batches: 8
  discount_factor: 0.95
  lambda: 0.95
  learning_rate: 3.0e-4
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.008
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.005
  value_loss_scale: 2.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.12
  time_limit_bootstrap: False
  experiment:
    directory: "sonar_centroid_track"
    experiment_name: "auv_residual_ppo_AB_Cblend03_swayfocus"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 51200  # overridden by train.py: max_iterations * rollouts (800 * 64)
  environment_info: log
