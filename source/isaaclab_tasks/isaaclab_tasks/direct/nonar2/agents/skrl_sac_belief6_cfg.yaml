seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.0
    network:
      - name: net
        input: STATES
        layers: [128, 128]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [128, 128]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 30000

agent:
  class: SAC
  rollouts: 1
  gradient_steps: 1
  batch_size: 128
  discount_factor: 0.80
  polyak: 0.01
  actor_learning_rate: 1.5e-5
  critic_learning_rate: 8.0e-6
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 1000
  learning_starts: 1000
  grad_norm_clip: 0.15
  learn_entropy: True
  initial_entropy_value: 0.2
  entropy_learning_rate: 1.5e-5
  target_entropy: -0.8
  rewards_shaper_scale: 0.05
  experiment:
    directory: "nonar2_belief6_sac"
    experiment_name: "minimal_v40_gt_obs_v20params"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 56000
  environment_info: log
