seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: 0.0
    network:
      - name: net
        input: STATES
        layers: [256, 256]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 256]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 256]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 256]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [256, 256]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  # skrl shape is (memory_size, num_envs, obs_dim). 500k×4×262 ≈ 2GB/tensor → OOM on 8GB GPU.
  memory_size: 50000

agent:
  class: SAC
  rollouts: 1
  gradient_steps: 1
  batch_size: 128
  discount_factor: 0.95
  polyak: 0.005
  actor_learning_rate: 5.0e-5
  critic_learning_rate: 5.0e-5
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 1000
  learning_starts: 1000
  grad_norm_clip: 0.5
  learn_entropy: True
  initial_entropy_value: 0.2
  entropy_learning_rate: 5.0e-5
  # 1-DoF action: keep minimum exploration (prevents α→0 too early).
  target_entropy: -1.0
  rewards_shaper_scale: 0.04
  experiment:
    directory: "nonar2_sonar_sac"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 35000
  environment_info: log
