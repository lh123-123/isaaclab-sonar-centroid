seed: 42

models:
  separate: True
  policy:
    class: GaussianMixin
    clip_actions: True
    clip_log_std: True
    min_log_std: -20.0
    max_log_std: 2.0
    initial_log_std: -1.0
    network:
      - name: net
        input: STATES
        layers: [64, 64]
        activations: elu
    output: ACTIONS
  critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [64, 64]
        activations: elu
    output: ONE
  critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [64, 64]
        activations: elu
    output: ONE
  target_critic_1:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [64, 64]
        activations: elu
    output: ONE
  target_critic_2:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES_ACTIONS
        layers: [64, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: 200000

agent:
  class: SAC
  rollouts: 1
  gradient_steps: 1
  batch_size: 128
  discount_factor: 0.99
  polyak: 0.01
  actor_learning_rate: 1.0e-4
  critic_learning_rate: 1.0e-4
  learning_rate_scheduler: null
  learning_rate_scheduler_kwargs: {}
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  random_timesteps: 1000
  learning_starts: 1000
  grad_norm_clip: 0.5
  learn_entropy: True
  initial_entropy_value: 0.05
  entropy_learning_rate: 1.0e-4
  target_entropy: -0.5
  rewards_shaper_scale: 0.2
  experiment:
    directory: "sonar_ibvs_drl"
    experiment_name: "lateral1d_centroid_sac"
    write_interval: auto
    checkpoint_interval: auto

trainer:
  class: SequentialTrainer
  timesteps: 300000
  environment_info: log
