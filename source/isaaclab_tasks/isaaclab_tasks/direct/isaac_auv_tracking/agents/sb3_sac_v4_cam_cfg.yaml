# SPDX-License-Identifier: BSD-3-Clause
# Direct-v4-cam SAC: K=4 stacked RGB frames (12 ch) + 1 GT flow image (2 ch) at 64x64,
# i.e. 14 channels into the first convolution. Restored to the 800k training snapshot
# (models/auv_tracking/v4_cam_sb3_sac_800k/params/) on 2026-09-29.
#
# Hyperparams follow HoloOcean's *vision* config (drltrakc/RL_AUV_tracking/configs/algorithm/
# sac_v1.yml), which is this task's counterpart: v4-cam keeps v0's task semantics but takes the
# visual form Holo v1 does. Aligned with sac_v1: net_arch pi=[512,256,256] / qf=[512,256],
# features_dim=512, tau=0.005, learning_starts=1000, lr=1e-4, batch=256, gamma=0.99.
#
# Deliberate deviations from sac_v1, and why:
#   * seed 66 / 1M steps follow sac_v0_fast, not v1's 42 / 5M.
#   * MidCNNExtractor instead of v1's ResNet Encoder. Correction: v1's EncoderResNet is
#     `models.resnet50('IMAGENET1K_V1')` (rgb_net.py:52) -- ImageNet-pretrained, 25.6M params --
#     NOT ResNet18; an earlier revision of this comment claimed ResNet18 / 11.2M params, which was
#     wrong. State the tradeoff honestly: at 64x64 the pretrained trunk is ~0.33 GMACs (cheap) but
#     ResNet50's layer4 collapses to 2x2, so spatial detail is largely pooled away. Pretrained
#     features on this low-contrast scene (cam_encoder measured 89% of pixels at R==G==B) are
#     probably worth more than a from-scratch CNN, so this deviation is a *risk*, not a win. It is
#     kept only because the current pipeline is already validated end-to-end; revisit first if the
#     actor still fails to learn. Encoder cost is printed by `scripts/debug_auv_cam_spaces.sh`.
#   * We feed K=4 stacked luma frames; v1 feeds ONE RGB frame -- `image = self.image_buffer
#     .get_buffer()[-1]` (world_auv_v1.py:140), where the buffer_size=5 is unused and the
#     `np.stack` line just above is commented out. Stacking keeps an explicit velocity cue.
#   * v1 renders at 960x540 and downsamples with cv2.INTER_AREA; TiledCamera renders 64x64
#     directly, which is aliased and trips the DLSS warning "Render resolution of (74, 74) is below
#     minimal input resolution of 300". Same observation shape, materially less information.
#     Revisit together with the backbone if the actor still cannot read the image.
#   * HoloOcean's `noise_std: 0.12` is inert: its trainer hardcodes NormalActionNoise(sigma=0.05).
#     0.05 below matches what actually ran.
#   * `step_per_collect` / `update_per_step` / `n_step` / `alpha_lr` / `auto_alpha` in sac_v1 are
#     Tianshou leftovers its SB3 path never reads, so they have no counterpart here.
#
# Asymmetric actor/critic (v1's CustomSACPolicy), matching Holo v1 exactly:
#   Actor  <- obs["image"]  : K=4 luma frames -> MidCNNExtractor -> pi MLP
#   Critic <- obs["state"]  : 4-D KF belief [r, alpha, log det(Sigma), observed] -> qf MLP
# The critic deliberately does NOT see the image. The v0 reward is c_mean * -log det(Sigma), a
# function of the filter covariance, which is not recoverable from luma frames; a symmetric CNN
# critic cannot estimate it and the Q targets diverge. The earlier symmetric run showed exactly
# that: critic_loss 9 -> 97, actor_loss 0.8 -> 108, ep_rew -222 -> -320 with ep_len 192 -> 117.
#
# Cost note: this is NOT more expensive than the symmetric variant. make_critic is overridden and
# returns a state-only MLP, so the total CNN count stays at one (make_actor builds it). The critic
# is (4 + action_dim) -> [512, 256] -> 1.
#
# SB3's DictReplayBuffer keeps TWO copies (observations and next_observations) of ONE observation
# (the 800k scheme: K=4 RGB frames + 1 GT flow image):
#     image  : 12 * 64 * 64 * 1 B (uint8 RGB stack)   =  49152 B
#     flow   :  2 * 64 * 64 * 4 B (float32 flow)      =  32768 B
#     state  :           4 * 4 B (float32 belief)     =     16 B
#                                              total =  81936 B
# so a buffer of N transitions costs N * 2 * 81936 B:
#   buffer_size= 15000 => 2.29 GiB (the value below)
#
# This is the total host RAM the buffer needs; the earlier notes in this file about a
# "15 GiB / RTX 5060" ceiling were written for a different machine and do not bound this
# config. Size it against whatever host actually runs the training.

# IMPORTANT: `buffer_size` is the TOTAL number of transitions, NOT per environment.
# DictReplayBuffer allocates `np.zeros((buffer_size // num_envs, num_envs, *shape))`, so num_envs
# only reshapes the array -- the footprint is identical at 8 and 16 envs (verified against SB3
# 2.8). An earlier revision of this comment multiplied by num_envs and so overstated the buffer by
# 8-16x, and `scripts/debug_auv_cam_spaces.sh` inherited the same factor; both are now corrected
# and the probe prints the live figure. The float32 GT flow image is why one observation is
# 81936 B rather than the 49152 B the RGB stack alone would suggest.
# The buffer is host (numpy) memory; numpy allocates with calloc, so unfilled capacity is not
# resident until written.
#
# Scale for context: the older sonar-vision runs asked for buffer_size=100000 at 16 envs, i.e.
# 15.3 GiB on a 15 GiB + 18.6 GiB swap machine; that only appeared to work because numpy
# allocates with calloc and the run stopped well before filling, at 25 env-steps/s.
#
# NOTE: features_dim does NOT change the replay buffer (observations are still uint8 frames);
# it only widens the extractor trunk and the head inputs.

seed: 66
n_timesteps: 1000000
# Holo v1's asymmetric policy: actor on image features, critic on the belief state.
policy: "isaaclab_tasks.direct.isaac_auv_tracking.agents.custom_sac_policy.CustomSACPolicy"

learning_rate: 0.0001
# 800k snapshot values (models/auv_tracking/v4_cam_sb3_sac_800k/params/agent.yaml).
# Reverted 2026-09-29 from buffer_size 20000 / learning_starts 8000: that pair was part of
# the same 09-28 revision line whose reward rebalance never produced a usable policy.
# NOTE: buffer 15000 here is the 800k value; the earlier claim that 20000 is the RAM ceiling
# on this box is host-specific (see the cost note above) and does not apply to the 15 GiB
# machine this config is trained on.
buffer_size: 15000
# 1000 total = 125 steps/env at 8 envs. Matches the 800k snapshot (and Holo's single-env
# config). The 09-28 revision raised it to 8000 to give the critic more random play first;
# that change is reverted with the rest of the revert. Revisit only if the critic diverges.
learning_starts: 1000
batch_size: 256
tau: 0.005
gamma: 0.99
train_freq: 1
gradient_steps: 1
ent_coef: "auto"
target_entropy: "auto"
target_update_interval: 10
normalize_input: false
normalize_value: false

use_action_noise: true
action_noise_std: 0.05

policy_kwargs:
  # MUST stay false: CustomSACPolicy.make_critic ignores any extractor and returns a StateCritic
  # over obs["state"]. Sharing would be meaningless here (the critic never touches the CNN) and
  # would make SB3 hand the actor's extractor to make_critic.
  share_features_extractor: false
  net_arch:
    pi: [512, 256, 256]
    qf: [512, 256]
  features_extractor_class: "isaaclab_tasks.direct.isaac_auv_tracking.agents.cam_encoder.MidCNNExtractor"
  features_extractor_kwargs:
    # 512 matches HoloOcean sac_v1's Encoder(features_dim=512); the small CNN has few params, so
    # widening the trunk is nearly free and gives the pi head the same input width v1 uses.
    features_dim: 512
    # Actor input is the 800k scheme: K=4 RGB frames (12 ch) + 1 GT flow image (2 ch).
    # MidCNNExtractor concatenates flow_image with the stack, so the first convolution
    # has 14 inputs for K=4.
    use_sparse_flow: false
  # NOTE: `normalize_images` is deliberately left at SB3's default (True). The extractor guards
  # against being handed an already-normalised tensor, exactly like SonarEncoder.

device: "cuda:0"
