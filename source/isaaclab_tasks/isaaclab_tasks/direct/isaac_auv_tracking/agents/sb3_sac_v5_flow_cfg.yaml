# SPDX-License-Identifier: BSD-3-Clause
# Direct-v5-flow SAC (R8): the actor sees a (frame_stack*2 + 1, 64, 64) float32 stack --
# K=2 RAFT optical-flow frames (4 ch) plus the 1-channel orange-appearance mask, i.e. 5
# channels into the first convolution. (The flow is RAFT-estimated from consecutive renders
# by default; the analytic GT stamp is the flow_source="gt" ablation.) Two variables differ
# from Direct-v4-cam: buffer_size and gradient_steps (2026-10-12, see the dilution note by the
# buffer_size block below). Every other hyperparameter
# is otherwise identical to sb3_sac_v4_cam_cfg.yaml so a run here is comparable to the
# v4_cam_sb3_sac_800k baseline.
#
# Hyperparams follow HoloOcean's *vision* config (drltrakc/RL_AUV_tracking/configs/algorithm/
# sac_v1.yml), which is this task's counterpart: v5-flow keeps v0's task semantics but takes the
# visual form Holo v1 does. Aligned with sac_v1: net_arch pi=[512,256,256] / qf=[512,256],
# features_dim=512, tau=0.005, learning_starts=1000, lr=1e-4, batch=256, gamma=0.99.
#
# Deliberate deviations from sac_v1, and why:
#   * seed 66 / 1M steps follow sac_v0_fast, not v1's 42 / 5M.
#   * MidCNNExtractor instead of v1's ResNet Encoder. Correction: v1's EncoderResNet is
#     `models.resnet50('IMAGENET1K_V1')` (rgb_net.py:52) -- ImageNet-pretrained, 25.6M params --
#     NOT ResNet18; an earlier revision of this comment claimed ResNet18 / 11.2M params, which was
#     wrong. State the tradeoff honestly: at 64x64 the pretrained trunk is ~0.33 GMACs (cheap) but
#     ResNet50's layer4 collapses to 2x2, so spatial detail is largely pooled away. Pretrained
#     features on this low-contrast scene are probably worth more than a from-scratch CNN, so this
#     deviation is a *risk*, not a win. Note the asymmetry it creates with this config: flow is a
#     synthetic, high-contrast signal, so the "pretrained helps on a low-contrast scene" argument
#     carries much LESS weight here than it did for v4-cam's RGB input. Encoder cost is printed by
#     `scripts/debug_auv_cam_spaces.sh`.
#   * We feed K=2 stacked flow frames + 1 appearance channel (R8); v1 feeds ONE RGB frame --
#     `image = self.image_buffer.get_buffer()[-1]` (world_auv_v1.py:140), where the
#     buffer_size=5 is unused and the `np.stack` line just above is commented out. Stacking
#     keeps an explicit velocity cue. A single optical-flow frame ALREADY carries velocity, so
#     unlike RGB this stack supplies the history/change-rate of that velocity; R8 halved K to 2
#     because that history was redundant, and added the appearance mask because flow alone is
#     blind to a target that is holding still relative to the camera.
#   * v1 renders at 960x540 and downsamples with cv2.INTER_AREA; TiledCamera renders 64x64
#     directly, which is aliased and trips the DLSS warning "Render resolution of (74, 74) is below
#     minimal input resolution of 300". Same observation shape, materially less information.
#     This no longer bounds the observation at all -- see the note on the render below.
#   * HoloOcean's `noise_std: 0.12` is inert: its trainer hardcodes NormalActionNoise(sigma=0.05).
#     0.05 below matches what actually ran.
#   * `step_per_collect` / `update_per_step` / `n_step` / `alpha_lr` / `auto_alpha` in sac_v1 are
#     Tianshou leftovers its SB3 path never reads, so they have no counterpart here.
#
# Asymmetric actor/critic (v1's CustomSACPolicy), matching Holo v1 exactly:
#   Actor  <- obs["image"]  : K=2 flow frames + 1 appearance ch (5 total) -> MidCNNExtractor -> pi MLP
#   Critic <- obs["state"]  : 6-D [r, alpha, log det(Sigma), observed, v_surge, yaw_rate] -> qf MLP
# The critic deliberately does NOT see the flow. The v0 reward is c_mean * -log det(Sigma), a
# function of the filter covariance, which is not recoverable from a flow stack; a symmetric CNN
# critic cannot estimate it and the Q targets diverge. The earlier symmetric run showed exactly
# that: critic_loss 9 -> 97, actor_loss 0.8 -> 108, ep_rew -222 -> -320 with ep_len 192 -> 117.
#
# Cost note: this is NOT more expensive than the symmetric variant. make_critic is overridden and
# returns a state-only MLP, so the total CNN count stays at one (make_actor builds it). The critic
# is (4 + action_dim) -> [512, 256] -> 1.
#
# The camera render is still produced (it feeds the KF measurement through
# `_update_belief_from_camera`, which reads `self._tiled_camera.data.output["rgb"]` straight off
# the sensor) but it no longer enters the actor's observation and is not downsampled for it. The
# render was never on the observation's critical path -- the actor's flow is analytic, computed
# from the target's pinhole projection -- so the "aliased 64x64 render" caveat above no longer
# degrades the actor's input.
#
# SB3's DictReplayBuffer keeps TWO copies (observations and next_observations) of ONE observation:
#     image  :  5 * 64 * 64 * 4 B (float32 flow stack + mask) = 81920 B
#     state  :            6 * 4 B (float32 belief + ego vel)  =    24 B
#                                               total = 81944 B
# so a buffer of N transitions costs N * 2 * 81944 B:
#   buffer_size=106667 => 17.48 GiB (host numpy memory; remote box has 52 GiB available)
# For reference, the v4-cam scheme was 16400 B/transition (uint8 image), so the same
# buffer_size there was 0.25 GiB.
#
# 2026-10-12: buffer_size and gradient_steps were set from the measured "learning-budget
# dilution" result on this task (v0: matching gradient_steps=n_envs/3 and
# buffer_size=6667*n_envs reproduced the original 3-env SAC; diluting either stalled it).
#   gradient_steps=5      ~= n_envs/3, restoring 312k updates over 1M steps
#   buffer_size=106667    => 106667/16 = 6667 vec-steps of buffer horizon (5x more updates
#                            and 6.7x longer horizon than the gs=1/16000 draft).
# The earlier "15 GiB machine" RAM rationale is obsolete -- the training host reports
# 62 GB total / 52 GB available.

# IMPORTANT: `buffer_size` is the TOTAL number of transitions, NOT per environment.
# DictReplayBuffer allocates `np.zeros((buffer_size // num_envs, num_envs, *shape))`, so num_envs
# only reshapes the array -- the footprint is identical at 8 and 16 envs (verified against SB3
# 2.8). An earlier revision of this comment multiplied by num_envs and so overstated the buffer by
# 8-16x, and `scripts/debug_auv_cam_spaces.sh` inherited the same factor; both are now corrected
# and the probe prints the live figure.
# The buffer is host (numpy) memory; numpy allocates with calloc, so unfilled capacity is not
# resident until written.
#
# Scale for context: the older sonar-vision runs asked for buffer_size=100000 at 16 envs, i.e.
# 15.3 GiB on a 15 GiB + 18.6 GiB swap machine; that only appeared to work because numpy
# allocates with calloc and the run stopped well before filling, at 25 env-steps/s.

seed: 66
n_timesteps: 1000000
# Holo v1's asymmetric policy: actor on flow features, critic on the belief state.
policy: "isaaclab_tasks.direct.isaac_auv_tracking.agents.custom_sac_policy.CustomSACPolicy"

learning_rate: 0.0001
# 1M steps / seed 66 / learning_starts 1000 are the v4_cam_sb3_sac_800k values, kept so the two
# schemes are compared at equal budget. Only buffer_size moves, for the RAM reason above.
# 16 envs (2026-10-12): raised to 106667 so the buffer horizon is 106667//16 = 6667
# vec-steps (the measured sweet spot on this task); footprint 106667 * 2 * 81944 B = 17.5 GiB,
# fine on the 62 GB training host.
buffer_size: 106667
# 1000 total = 125 steps/env at 8 envs. Matches the 800k snapshot (and Holo's single-env
# config).
learning_starts: 1000
batch_size: 256
tau: 0.005
gamma: 0.99
train_freq: 1
# 5 ~= n_envs/3: with train_freq=1 this gives (1M-1k)/16*5 ~= 312k gradient updates,
# matching the update-density the dilution experiments identified as necessary on this task.
gradient_steps: 5
ent_coef: "auto"
target_entropy: "auto"
target_update_interval: 10
normalize_input: false
normalize_value: false

use_action_noise: true
action_noise_std: 0.05

policy_kwargs:
  # MUST stay false: CustomSACPolicy.make_critic ignores any extractor and returns a StateCritic
  # over obs["state"]. Sharing would be meaningless here (the critic never touches the CNN) and
  # would make SB3 hand the actor's extractor to make_critic.
  share_features_extractor: false
  net_arch:
    pi: [512, 256, 256]
    qf: [512, 256]
  features_extractor_class: "isaaclab_tasks.direct.isaac_auv_tracking.agents.cam_encoder.MidCNNExtractor"
  features_extractor_kwargs:
    # 512 matches HoloOcean sac_v1's Encoder(features_dim=512); the small CNN has few params, so
    # widening the trunk is nearly free and gives the pi head the same input width v1 uses.
    features_dim: 512
    # MidCNNExtractor takes its input width from observations["image"].shape[0], and this env no
    # longer publishes a "flow_image" key, so n_in is 8 (frame_stack * 2) with no code change.
    # Kept at its default for compatibility with the shared encoder.
    use_sparse_flow: false
  # NOTE: `normalize_images` is deliberately left at SB3's default (True). It is inert here:
  # SB3 only normalises spaces that `is_image_space` accepts, which requires uint8 + [0, 255],
  # and the flow stack is float32 in [-1, 1]. The extractor's own uint8/max>1.5 guard likewise
  # provably leaves a [-1, 1] float tensor alone, so the flow reaches conv1 unscaled.

device: "cuda:0"

