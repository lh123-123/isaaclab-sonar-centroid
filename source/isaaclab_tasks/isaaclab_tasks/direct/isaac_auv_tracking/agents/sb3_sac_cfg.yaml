# SPDX-License-Identifier: BSD-3-Clause
# Match Holo sac_v0_fast.yml (SB3 SAC) as closely as Isaac Lab allows.
# n_timesteps = total transitions across envs (SB3 convention); retrain budget 3e6

seed: 66
n_timesteps: 3000000
policy: "MlpPolicy"

# --- Holo policy_hparams ---
learning_rate: 0.0001
buffer_size: 20000
learning_starts: 5000
batch_size: 256
tau: 0.004
gamma: 0.99
train_freq: 1
gradient_steps: 1
# Holo auto_alpha + alpha=0.2
ent_coef: "auto"
target_entropy: "auto"
target_update_interval: 10
# Holo: no VecNormalize
normalize_input: false
normalize_value: false

policy_kwargs:
  net_arch:
    pi: [256, 256, 256]
    qf: [256, 256]

device: "cuda:0"
