# SPDX-License-Identifier: BSD-3-Clause
# Direct-v2 ablation: STATE-ONLY (no image, no CNN). MLP on 8-D flow state.
# MLP hyperparams match v0 (not the v2 CNN yaml): smaller net, later learning_starts.
# Replay / exploration kept aligned with v2-image for a fair observation ablation.

seed: 66
n_timesteps: 3000000
policy: "MlpPolicy"

learning_rate: 0.0001
buffer_size: 100000
learning_starts: 5000
batch_size: 256
tau: 0.004
gamma: 0.99
train_freq: 1
gradient_steps: 1
ent_coef: "auto"
target_entropy: "auto"
target_update_interval: 10
normalize_input: false
normalize_value: false

use_action_noise: true
action_noise_std: 0.05

policy_kwargs:
  net_arch:
    pi: [256, 256, 256]
    qf: [256, 256]

device: "cuda:0"
