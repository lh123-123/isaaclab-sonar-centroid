# Isaac-Lh-2-Direct-v0 — Stable-Baselines3 PPO
#
# Uses MlpPolicy on the flattened policy observation (sonar H×W + tail).
# For sonar-heavy tasks, RSL-RL + Lh2SonarCnnActorCritic is usually more sample-efficient.
#
# Tune: n_steps × n_envs ≈ batch; ent_coef vs clip_range; net_arch for capacity.

seed: 42

n_timesteps: !!float 5e6
policy: "MlpPolicy"
n_steps: 64
batch_size: 2048
gae_lambda: 0.95
gamma: 0.99
n_epochs: 8
ent_coef: 0.006
learning_rate: !!float 5e-5
clip_range: !!float 0.2
policy_kwargs: "dict(
                  activation_fn=nn.ELU,
                  net_arch=dict(pi=[256, 128, 64], vf=[256, 128, 64]),
                  squash_output=False,
                )"
vf_coef: 0.5
max_grad_norm: 0.5
device: "cuda:0"
