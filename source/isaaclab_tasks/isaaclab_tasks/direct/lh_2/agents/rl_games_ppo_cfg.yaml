# Isaac-Lh-2-Direct-v0 — rl_games-style PPO (continuous)
#
# Larger MLP than cartpole template; align clip/normalization with other Lh-2 agents.

params:
  seed: 42

  env:
    clip_observations: 5.0
    clip_actions: 1.0

  algo:
    name: a2c_continuous

  model:
    name: continuous_a2c_logstd

  network:
    name: actor_critic
    separate: false
    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: 0
        fixed_sigma: True
    mlp:
      units: [256, 128, 64]
      activation: elu
      d2rl: false
      initializer:
        name: default
      regularizer:
        name: None

  load_checkpoint: false
  load_path: ""

  config:
    name: lh2_sonar_direct
    env_name: rlgpu
    device: "cuda:0"
    device_name: "cuda:0"
    multi_gpu: false
    ppo: true
    mixed_precision: false
    normalize_input: true
    normalize_value: true
    num_actors: -1
    reward_shaper:
      scale_value: 1.0
    normalize_advantage: true
    gamma: 0.99
    tau: 0.95
    learning_rate: 5.0e-5
    lr_schedule: adaptive
    kl_threshold: 0.004
    score_to_win: 20000
    max_epochs: 2000
    save_best_after: 100
    save_frequency: 100
    grad_norm: 0.5
    entropy_coef: 0.006
    truncate_grads: true
    e_clip: 0.2
    horizon_length: 64
    minibatch_size: 16384
    mini_epochs: 8
    critic_coef: 0.5
    clip_value: true
    seq_length: 4
    bounds_loss_coef: 0.0001
