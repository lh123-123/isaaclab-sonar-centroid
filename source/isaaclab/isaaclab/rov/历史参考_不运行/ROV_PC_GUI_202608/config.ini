# ================================================================
# 比赛前只需在这里改开关；默认全部关闭，不会意外介入推力。
# 速度闭环依赖 IMU 加速度积分估速，没有 DVL，仅限试验。
# ================================================================
[features]
speed_closed_loop = false

[network]
# 电脑与树莓派网线直连固定地址
pi_ip = 192.168.1.3
pc_ip = 192.168.1.4
netmask = 255.255.255.0
bind_host = 0.0.0.0
command_port = 5000
telemetry_port = 5001
joystick_port = 5555

[video]
# USB camera is streamed separately from the signed control channel.  This
# URL is display-only and never arms, enables, or otherwise controls motion.
mjpeg_url = http://192.168.1.3:8080/stream.mjpg

[safety]
# 比赛前完成拆桨/单桨标定后，才允许把此项改为 true。
# false 时仍计算控制量和8路PWM并回传遥测，但不会打开PCA9685。
motion_output_enabled = true
# GUI不需要持续按键；点击解锁后保持。控制包中断后必须人工再次点击解锁。
command_timeout_ms = 500
# Before every unlock, Pi must receive a neutral joystick frame continuously
# for this long. This protection is enforced on Pi; the GUI only assists it.
arm_neutral_threshold = 0.01
arm_neutral_dwell_ms = 250
allowed_ground_ip = 192.168.1.4
protocol_version = 6
max_command_packet_bytes = 4096
# PC与Pi必须完全相同。此文件若曾对外发送/上传，请立即生成新64位hex密钥并两端同步。
shared_key = 1f8b3e07d86a40b48bd5c6a4927fe1a9d2c745ea0548fc91b67e30d43ca259be
# 旧的裸JSON/5555端口没有认证，默认永久关闭。
allow_legacy_unsigned = false
legacy_joystick_enabled = false

[hardware]
imu_port = /dev/serial0
imu_baud = 115200
imu_report_rate_hz = 20
# IMU sensor-axis convention used by the Pi before both telemetry and attitude
# control. Bench observation: Roll matches; Pitch and Z-axis rotation are
# opposite. Adjust only after a safe, locked bench check.
imu_roll_inverted = false
imu_pitch_inverted = true
# Persistent operator datum for the three Euler attitude angles. Options
# captures the current physical attitude into these offsets while locked.
imu_roll_offset_deg = -26.630859375
imu_pitch_offset_deg = -1.56005859375
imu_yaw_inverted = true
imu_heading_inverted = true
imu_yaw_offset_deg = 44.2364501953125
imu_heading_offset_deg = 0.0
# Persistent three-dimensional IMU-to-ROV installation transform.  The
# legacy signs/offsets above remain active only until this is calibrated.
imu_3d_mount_calibrated = true
imu_mount_quat_w = 0.972867342453
imu_mount_quat_x = -0.230027713778
imu_mount_quat_y = -0.024824807320
imu_mount_quat_z = 0.000337377154
imu_reference_quat_w = 0.990917972662
imu_reference_quat_x = -0.014571408993
imu_reference_quat_y = 0.005456593131
imu_reference_quat_z = -0.133564482877
depth_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
depth_baud = 19200
depth_address = 1
# Calibrated 2026-08-12 with the fully assembled, bubble-free front end.
# The current stored surface reference is 0.025500 MPa; 0.003300 MPa was the
# earlier air/reference reading and must not be silently substituted.
depth_raw_zero_mpa = 0.025500
depth_m_per_mpa = 101.972
pwm_i2c_address = 0x40
pwm_neutral_us = 1540
pwm_min_us = 1100
pwm_max_us = 1900
pwm_output_min_us = 1200
pwm_output_max_us = 1850
esc_initialization_seconds = 5.0
mag_calibration_file = mag_calibration.json

[servo]
# PCA9685 channel 8 is the first channel after the eight thrusters (0..7).
# Keep this false until the servo has its own 7.4 V supply and its motion has
# been checked without a loaded mechanism. This never enables thruster PWM.
output_enabled = true
channel = 8
# Full-range mapping copied from the supplied STM32 single-servo reference.
# Fixed physical mapping; the GUI's RB-close value is the live software minimum.
# 0° = 1000 us, 90° = 1500 us, 180° = 2000 us.
pulse_min_us = 1000
pulse_center_us = 1500
pulse_max_us = 2000
angle_min_deg = 0.0
angle_max_deg = 180.0
# The upper software limit remains fixed at 180 degrees.
slew_deg_per_sec = 360.0
# One-button gripper control. RB / R1 is pygame button 10 on the tested DualSense layout.
# Startup is closed. The first press opens; the next press closes.
toggle_button = 10
open_position = 0.5555555555555556
closed_position = 0.16666666666666666
# Stick-click fine control is independent of the RB fixed-open target.
# R3 opens smoothly to the full calibrated slider endpoint; L3 closes.
jog_open_position = 0.85
# The GUI consumes held-button state at 5 Hz: 0.05/tick = 25% travel/s.
jog_step_per_refresh = 0.05
# This position is commanded on E-stop, command timeout, GUI close, and start.
# Release most clamp load after link loss/E-stop instead of holding a hard stall.
failsafe_position = 0.16666666666666666

[thrusters]
# 每项顺序固定为 lateral_fl,lateral_fr,lateral_rl,lateral_rr,
# vertical_fl,vertical_fr,vertical_rl,vertical_rr。实装已确认 CH4=LF, CH5=RF,
# CH6=LR, CH7=RR；面板负电机指令实测产生向上力，正指令向下。
channels = 0,1,2,3,4,5,6,7
# 横推保留已有反向；四垂推的电机指令符号与车体 +Z(向下)
# 物理力符号相同，因此 CH4-7 不再二次翻转。
motor_signs = -1,-1,-1,-1,1,1,1,1
# The installed ESCs were bench-verified to stop at 1540us; do not substitute
# the vendor nominal 1500us without re-calibrating every ESC.
# GUI可在0..0.5内分别修改水平和垂直上限。每个方向都用较小的
# 55N反推额定值作共同基准，因此正反最大软件指令力完全相同：55*r。
# max_command_fraction是不可被GUI突破的绝对上限；下面两项是开机恢复值。
max_command_fraction = 0.50
horizontal_limit_fraction = 0.2
vertical_limit_fraction = 0.3
# 这两组是0.5倍率对应的最终硬件保险窗；运行时还会按当前倍率进一步限力。
pwm_min_us = 1316,1316,1316,1316,1316,1316,1316,1316
pwm_max_us = 1714,1714,1714,1714,1714,1714,1714,1714
# Use the measured startup thresholds for all eight installed ESCs.
# Keep 1540us as the verified stop point; any non-zero command jumps past
# the directional deadband before the normal force-to-PWM conversion.
reverse_start_us = 1532
forward_start_us = 1578
lateral_x_m = 0.200
lateral_y_m = 0.200
vertical_x_m = 0.0625
vertical_y_m = 0.1775
lateral_angle_deg = 45.0
# Four central vertical thrust lines, measured from the vehicle centre of mass
# in body axes (+x forward, +y right, +z down).  Directions are unit vectors
# for positive nominal thrust.  These mirror the currently configured symmetric
# arms but are not physical acceptance evidence; replace them only from COM-to-
# thrust-line measurements, never from the outer drawing size.
vertical_fl_position_m = 0.0625,-0.1775,0.0
vertical_fl_direction_body = 0.0,0.0,1.0
vertical_fr_position_m = 0.0625,0.1775,0.0
vertical_fr_direction_body = 0.0,0.0,1.0
vertical_rl_position_m = -0.0625,-0.1775,0.0
vertical_rl_direction_body = 0.0,0.0,1.0
vertical_rr_position_m = -0.0625,0.1775,0.0
vertical_rr_direction_body = 0.0,0.0,1.0

[timeouts]
command_seconds = 0.5
joystick_seconds = 0.5
imu_freshness_seconds = 0.35
depth_freshness_seconds = 1.25

[control]
loop_hz = 20.0
telemetry_hz = 20.0
depth_query_hz = 10.0
performance_mode = balance
manual_deadband = 0.001
# 20Hz控制循环：保持原有每秒最大变化率，平移/升沉每周期5N，力矩每周期2Nm。
# 满杆约0.8..2.0秒达到；松杆也按相同斜率减到零。
max_force_step_per_cycle = 5.0
max_moment_step_per_cycle = 2.0
# Input exponent > 1 gives fine low-speed control while retaining full output
# at full stick/trigger travel.  1.0 restores the old linear response.
joystick_response_exponent = 2.2
trigger_response_exponent = 2.2
# GUI-side depth command guardrails. Pi telemetry must also report a fresh
# depth sample before the GUI can enable depth hold.
depth_target_min_m = -0.20
depth_target_max_m = 10.0
depth_target_max_step_m = 0.75
# Depth hold uses a control-only EMA filter.  The GUI continues to display
# the raw pressure-derived depth so calibration evidence remains visible.
depth_hold_deadband_m = 0.015
depth_hold_filter_alpha = 0.55
# After a manual heave release, retain the learned static integral internally
# but suppress it while it reinforces residual vertical inertia.  Restore the
# full bias once filtered vertical speed falls below this threshold.
depth_release_brake_exit_speed_mps = 0.03
# Depth PID output is capped below the allocator's 66 N base-heave ceiling,
# leaving headroom for roll/pitch correction in the reserved vertical window.
depth_max_force_n = 60.0
# Optional equal vertical feed-forward, summed independently with manual heave
# or depth PID output.  Zero disables only this feed-forward; depth/heave and
# attitude control remain active.  It is applied only while propulsion is armed
# and a live command source exists; lock, E-stop, link loss, and service startup
# always command neutral output.
vertical_hover_force_per_thruster_n = 0.0
# Direction-specific vertical balance. Fixed hover alone remains equal on all
# four thrusters. Negative makes the front pair stronger; positive the rear.
vertical_ascent_front_rear_trim_percent = 0.0
vertical_descent_front_rear_trim_percent = 0.0
# When pitch hold is active, blend the calibrated direction trim into the PID.
# 0 disables fusion; 0.5 is the first-water-test commissioning value.
pitch_heave_feedforward_scale = 0.25
# Forward/backward trims keep the diagonal thrusters on their normal allocation
# and independently apply equal-and-opposite front/rear corrections to the four
# vertical thrusters. Both return to zero when the corresponding motion stops.
forward_front_rear_trim_percent = 0.0
backward_front_rear_trim_percent = 0.0
# Roll/pitch stabilization uses closed-loop IMU error and the four vertical
# thrusters. Yaw stabilization uses only the four horizontal diagonal
# thrusters and shares their allocator with normal translation commands.
# These are safety limits, not fixed balance compensation.
# The proportional gains reach these limits near 25 degrees.  The four
# vertical thrusters reserve the 0.3..0.5 window for this zero-sum correction,
# so attitude/feed-forward authority remains available at full base heave.
roll_max_moment_nm = 4.0
pitch_max_moment_nm = 3.5
yaw_max_moment_nm = 4.0
# After manual yaw returns to neutral, keep the yaw PID paused while inertia
# decays. Capture the new target only after |gyro Z| stays below this rate.
# Lower values coast longer; higher values brake sooner.
yaw_release_rate_threshold_dps = 3.0
# Commissioning accepted: CH4-7 identity, vertical motor-force signs, and the
# calibrated vehicle Roll/Pitch positive directions were physically confirmed.
# Old configurations without this key still fail closed as false.
attitude_control_mapping_validated = true
# Equal hover tilt compensation remains capped so it cannot consume all
# attitude authority.
attitude_hover_tilt_max_scale = 1.15
velocity_leak_factor = 0.95
[pid]
# Faster depth response: position PI plus measured vertical-speed damping.
# Kd is applied to filtered Vz, not to quantized pressure differences.
depth_kp = 55.0
depth_ki = 4.0
depth_kd = 50.0
heading_kp = 0.5
heading_ki = 0.0
heading_kd = 0.0
# 实验性前向速度闭环（m/s -> N）
speed_kp = 40.0
speed_ki = 2.0
speed_kd = 0.0
# Geometric tilt PI-D units: Kp Nm/deg, Ki Nm/(deg*s), Kd Nm/(deg/s).
# D uses calibrated body gyro rates; bounded conditional I rejects persistent
# CG/CB/cable bias without winding up against the moment limit.
roll_kp = 0.25
roll_ki = 0.02
roll_kd = 0.09
pitch_kp = 0.3
pitch_ki = 0.015
pitch_kd = 0.13
# IMU yaw lock about calibrated 0 degrees; gyro Z supplies rate damping.
yaw_kp = 0.21
yaw_ki = 0.01
yaw_kd = 0.09

# LB toggles between these two complete operating profiles.  Fractions are
# percentages of the 0.5 global command ceiling (0.20 = 20%).
[mode_balance]
horizontal_limit_fraction = 0.2
vertical_limit_fraction = 0.25
hover_force_per_thruster_n = 0.0
vertical_ascent_front_rear_trim_percent = -10.0
vertical_descent_front_rear_trim_percent = 0.0
forward_front_rear_trim_percent = -100.0
backward_front_rear_trim_percent = 0.0
left_lateral_surge_trim_percent = -16.0
right_lateral_surge_trim_percent = -20.0
roll_max_moment_nm = 4.0
pitch_max_moment_nm = 5.0
yaw_max_moment_nm = 4.0
roll_kp = 0.25
roll_ki = 0.02
roll_kd = 0.09
pitch_kp = 0.3
pitch_ki = 0.02
pitch_kd = 0.14
yaw_kp = 0.25
yaw_ki = 0.08
yaw_kd = 0.09

[mode_rage]
# Conservative first-water-test preset; the global 0.50 ceiling still applies.
horizontal_limit_fraction = 0.4
vertical_limit_fraction = 0.3
hover_force_per_thruster_n = 0.0
vertical_ascent_front_rear_trim_percent = 0.0
vertical_descent_front_rear_trim_percent = 0.0
forward_front_rear_trim_percent = -70.0
backward_front_rear_trim_percent = 50.0
left_lateral_surge_trim_percent = -10.5
right_lateral_surge_trim_percent = -13.0
roll_max_moment_nm = 4.0
pitch_max_moment_nm = 3.5
yaw_max_moment_nm = 5.0
roll_kp = 0.32
roll_ki = 0.02
roll_kd = 0.11
pitch_kp = 0.38
pitch_ki = 0.015
pitch_kd = 0.16
yaw_kp = 0.27
yaw_ki = 0.01
yaw_kd = 0.11

[logging]
log_file = rov_control.log
log_max_bytes = 5242880
log_backup_count = 10
data_directory = date
max_session_files = 10
joystick_debug = false
thrust_debug = false
